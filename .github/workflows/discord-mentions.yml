name: Discord 이슈 멘션 알림

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

# 이벤트 내용만 사용하며 저장소 코드나 GitHub API 접근 권한은 필요하지 않다.
permissions: {}

jobs:
  notify:
    # issue_comment에는 PR 댓글도 포함되므로 이슈만 처리한다.
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 새 멘션을 Discord 사용자에게 전달
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        shell: bash
        # 이슈 내용은 셸에 삽입하지 않고 이벤트 JSON에서 데이터로 읽는다.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          issue = event["issue"]
          if "pull_request" in issue:
              raise SystemExit(0)
          item = event.get("comment", issue)

          def mentions(body):
              # 코드 블록·인라인 코드·인용문 속 예시 멘션은 제외한다.
              body = re.sub(r"(?ms)^ {0,3}(`{3,}|~{3,})[^\n]*\n.*?^ {0,3}\1[^\n]*(?:\n|$)", "", body)
              body = re.sub(r"(?m)^\s*>.*$", "", body)
              body = re.sub(r"(`+)[^`]*?\1", "", body)
              # 이메일·이스케이프·팀 멘션은 개인 멘션으로 취급하지 않는다.
              pattern = r"(?<![\w./@\\`])@([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?)(?![\w/-])"
              return {name.lower() for name in re.findall(pattern, body)}

          targets = mentions(item.get("body") or "")
          if event["action"] == "edited":
              previous = event.get("changes", {}).get("body")
              if previous is None:
                  # 제목 등 본문 이외의 변경에서는 알림을 보내지 않는다.
                  raise SystemExit(0)
              targets -= mentions(previous.get("from") or "")
          if not targets:
              print("새로운 개인 멘션이 없어 알림을 생략합니다.")
              raise SystemExit(0)

          try:
              user_map = json.loads(os.environ.get("DISCORD_USER_MAP") or "{}")
              if not isinstance(user_map, dict):
                  raise ValueError()
              user_map = {name.lower(): value for name, value in user_map.items()}
              if any(not isinstance(value, str) or not re.fullmatch(r"[0-9]{17,20}", value)
                     for value in user_map.values()):
                  raise ValueError()
          except (ValueError, AttributeError):
              raise SystemExit("DISCORD_USER_MAP은 GitHub 아이디와 따옴표로 감싼 Discord 숫자 ID의 JSON 객체여야 합니다.")

          ids = sorted({user_map[name] for name in targets if name in user_map})
          if not ids:
              print("연결된 Discord 사용자가 없어 알림을 생략합니다.")
              raise SystemExit(0)
          content = " ".join(f"<@{user_id}>" for user_id in ids)
          if len(ids) > 100 or len(content) > 2000:
              raise SystemExit("멘션 대상이 Discord 메시지 제한을 초과했습니다.")

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          parts = urllib.parse.urlsplit(webhook)
          if parts.scheme != "https" or parts.netloc != "discord.com" or not re.fullmatch(
              r"/api/webhooks/[0-9]+/[A-Za-z0-9_-]+", parts.path
          ):
              raise SystemExit("DISCORD_WEBHOOK_URL에 Discord에서 복사한 웹훅 URL을 등록하세요.")
          query = dict(urllib.parse.parse_qsl(parts.query))
          query["wait"] = "true"
          webhook = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          kind = "이슈 댓글" if "comment" in event else "이슈 본문"
          # 알림 본문에 이슈와 멘션된 댓글로 이동하는 링크를 명시한다.
          links = f"[이슈 바로가기]({issue['html_url']})"
          if "comment" in event:
              links += f" · [댓글 바로가기]({item['html_url']})"
          payload = {
              "content": content,
              # 등록된 대상만 멘션하고 everyone·here·역할 멘션은 허용하지 않는다.
              "allowed_mentions": {"parse": [], "users": ids},
              "embeds": [{
                  "title": f"#{issue['number']} {issue['title']}"[:256],
                  "url": item["html_url"],
                  "description": f"{kind}에서 GitHub 계정이 멘션되었습니다.\n\n{links}",
                  "fields": [
                      {"name": "저장소", "value": event["repository"]["full_name"]},
                      {"name": "작성·수정자", "value": event["sender"]["login"]},
                  ],
                  "color": 5793266,
              }],
          }
          request = urllib.request.Request(
              webhook, data=json.dumps(payload).encode("utf-8"), method="POST",
              headers={"Content-Type": "application/json", "User-Agent": "GitHub-Issue-Mentions"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read()
          except urllib.error.HTTPError as error:
              # 오류 응답이나 URL에 포함된 웹훅 토큰을 로그에 노출하지 않는다.
              raise SystemExit(f"Discord 알림 전송 실패: HTTP {error.code}")
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Discord 알림 연결 실패: 네트워크 상태를 확인하세요.")
          print("Discord 멘션 알림을 전송했습니다.")
          PY
